name: Build clean Cheat Engine 7.5

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-clean-ce75.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out official Cheat Engine 7.5 source
        shell: pwsh
        run: |
          git clone --depth 1 --branch 7.5 --recurse-submodules https://github.com/cheat-engine/cheat-engine.git upstream
          $commit = (git -C upstream rev-parse HEAD).Trim()
          "UPSTREAM_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Official Cheat Engine source commit: $commit"

      - name: Download official Lazarus 2.2.2 / FPC 3.2.2 toolchain
        shell: pwsh
        run: |
          $base = 'https://downloads.sourceforge.net/project/lazarus/Lazarus%20Windows%2064%20bits/Lazarus%202.2.2'
          curl.exe -L --fail --retry 5 --retry-delay 5 "$base/lazarus-2.2.2-fpc-3.2.2-win64.exe" -o lazarus-main.exe
          curl.exe -L --fail --retry 5 --retry-delay 5 "$base/lazarus-2.2.2-fpc-3.2.2-cross-i386-win32-win64.exe" -o lazarus-cross.exe
          if (!(Test-Path lazarus-main.exe) -or ((Get-Item lazarus-main.exe).Length -lt 10MB)) { throw 'Lazarus installer download looks invalid' }
          if (!(Test-Path lazarus-cross.exe) -or ((Get-Item lazarus-cross.exe).Length -lt 5MB)) { throw 'Lazarus cross-compiler installer download looks invalid' }

      - name: Install Lazarus toolchain
        shell: pwsh
        run: |
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/DIR=C:\Lazarus')
          $p = Start-Process -FilePath "$PWD\lazarus-main.exe" -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Main Lazarus installer exited with $($p.ExitCode)" }
          $p = Start-Process -FilePath "$PWD\lazarus-cross.exe" -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Lazarus cross-compiler installer exited with $($p.ExitCode)" }
          if (!(Test-Path 'C:\Lazarus\lazbuild.exe')) { throw 'lazbuild.exe was not installed' }
          & 'C:\Lazarus\lazbuild.exe' --version

      - name: Build Cheat Engine 7.5 x64 from source
        shell: pwsh
        run: |
          & 'C:\Lazarus\lazbuild.exe' '--build-mode=Release 64-Bit' '.\upstream\Cheat Engine\cheatengine.lpi'
          if ($LASTEXITCODE -ne 0) { throw "lazbuild failed with exit code $LASTEXITCODE" }
          $exe = '.\upstream\Cheat Engine\bin\cheatengine-x86_64.exe'
          if (!(Test-Path $exe)) { throw 'Expected cheatengine-x86_64.exe was not produced' }
          Write-Host "Built: $exe"

      - name: Build .NET data collectors from source
        shell: pwsh
        run: |
          $sln = '.\upstream\Cheat Engine\DotNetDataCollector\DotNetDataCollector.sln'
          $proj = '.\upstream\Cheat Engine\DotNetDataCollector\DotNetDataCollector\DotNetDataCollector.vcxproj'

          # CE 7.5's project targets the older VS2017/Windows 8.1 toolchain.
          # Build the same source using the VS2022 toolchain available on the runner.
          $xml = Get-Content $proj -Raw
          $xml = $xml.Replace('<PlatformToolset>v141</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>')
          $xml = $xml.Replace('<WindowsTargetPlatformVersion>8.1</WindowsTargetPlatformVersion>', '<WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>')
          Set-Content -Path $proj -Value $xml -Encoding utf8

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = (& $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1)
          if (!$msbuild) { throw 'MSBuild not found on runner' }
          Write-Host "MSBuild: $msbuild"

          & $msbuild $sln /m /t:Build /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "DotNetDataCollector x64 build failed with exit code $LASTEXITCODE" }

          & $msbuild $sln /m /t:Build /p:Configuration=Release /p:Platform=Win32
          if ($LASTEXITCODE -ne 0) { throw "DotNetDataCollector Win32 build failed with exit code $LASTEXITCODE" }

          $dc64 = '.\upstream\Cheat Engine\bin\DotNetDataCollector64.exe'
          $dc32 = '.\upstream\Cheat Engine\bin\DotNetDataCollector32.exe'
          if (!(Test-Path $dc64)) { throw 'Expected DotNetDataCollector64.exe was not produced' }
          if (!(Test-Path $dc32)) { throw 'Expected DotNetDataCollector32.exe was not produced' }
          Write-Host "Built: $dc64"
          Write-Host "Built: $dc32"

      - name: Package clean portable folder
        shell: pwsh
        run: |
          $src = '.\upstream\Cheat Engine\bin'
          $dst = '.\dist\CheatEngine75-clean-x64'
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item "$src\*" $dst -Recurse -Force

          # Remove build/debug leftovers; keep normal CE support files plus the
          # freshly built .NET data collectors needed for managed-game symbols.
          Get-ChildItem $dst -Recurse -File -Include '*.dbg','*.pdb','*.o','*.ppu' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

          $exe = Join-Path $dst 'cheatengine-x86_64.exe'
          $dc64 = Join-Path $dst 'DotNetDataCollector64.exe'
          $dc32 = Join-Path $dst 'DotNetDataCollector32.exe'
          if (!(Test-Path $exe)) { throw 'Packaged Cheat Engine executable is missing' }
          if (!(Test-Path $dc64)) { throw 'Packaged x64 .NET collector is missing' }
          if (!(Test-Path $dc32)) { throw 'Packaged x86 .NET collector is missing' }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $hashDc64 = (Get-FileHash $dc64 -Algorithm SHA256).Hash
          $hashDc32 = (Get-FileHash $dc32 -Algorithm SHA256).Hash
          $size = (Get-Item $exe).Length

          @"
          Clean Cheat Engine 7.5 x64 build
          =================================
          Built by: GitHub Actions
          Upstream repository: https://github.com/cheat-engine/cheat-engine
          Upstream ref: 7.5
          Upstream commit: $env:UPSTREAM_COMMIT
          Main project: Cheat Engine/cheatengine.lpi
          Main build mode: Release 64-Bit
          Main compiler: Lazarus 2.2.2 / FPC 3.2.2
          Main executable: cheatengine-x86_64.exe
          Executable size: $size bytes
          Main SHA-256: $hash

          Additional source-built support:
          DotNetDataCollector64.exe SHA-256: $hashDc64
          DotNetDataCollector32.exe SHA-256: $hashDc32

          This artifact was built from source and does not contain or use the
          Cheat Engine public bundled-offer installer.
          "@ | Set-Content (Join-Path $dst 'BUILD-PROVENANCE.txt') -Encoding utf8

          Write-Host "CE SHA-256: $hash"
          Write-Host "DotNetDataCollector64 SHA-256: $hashDc64"
          Write-Host "DotNetDataCollector32 SHA-256: $hashDc32"

      - name: Upload clean build
        uses: actions/upload-artifact@v4
        with:
          name: CheatEngine75-clean-x64
          path: dist/CheatEngine75-clean-x64
          if-no-files-found: error
          compression-level: 9
