name: Build Infinite Angler Host

on:
  workflow_dispatch:
  push:
    paths:
      - 'terraria/infinite-angler-host/**'
      - '.github/workflows/build-infinite-angler-host.yml'
  pull_request:
    paths:
      - 'terraria/infinite-angler-host/**'
      - '.github/workflows/build-infinite-angler-host.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore terraria/infinite-angler-host/InfiniteAnglerHost.csproj

      - name: Publish single-file Windows executable
        run: >-
          dotnet publish terraria/infinite-angler-host/InfiniteAnglerHost.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -o out/InfiniteAnglerHost

      - name: Build synthetic server and vanilla-client fixture
        run: >-
          dotnet build terraria/infinite-angler-host/test-fixture/SyntheticTerraria.csproj
          -c Release
          -o out/fixture

      - name: Exercise real Host and Play file layout
        shell: pwsh
        run: |
          $patcher = (Resolve-Path 'out/InfiniteAnglerHost/InfiniteAnglerHost.exe').Path
          New-Item -ItemType Directory -Force 'out/hostplay' | Out-Null

          # Both filenames intentionally exist. Option A MUST choose TerrariaServer.exe.
          Copy-Item 'out/fixture/SyntheticTerrariaHost.dll' 'out/hostplay/TerrariaServer.exe'
          Copy-Item 'out/fixture/SyntheticTerrariaHost.dll' 'out/hostplay/Terraria.exe'
          Copy-Item 'out/fixture/SyntheticTerrariaHost.runtimeconfig.json' 'out/hostplay/TerrariaServer.runtimeconfig.json'
          Copy-Item 'out/fixture/SyntheticTerrariaHost.deps.json' 'out/hostplay/TerrariaServer.deps.json'

          $server = (Resolve-Path 'out/hostplay/TerrariaServer.exe').Path
          $client = (Resolve-Path 'out/hostplay/Terraria.exe').Path
          $serverBefore = (Get-FileHash $server -Algorithm SHA256).Hash
          $clientBefore = (Get-FileHash $client -Algorithm SHA256).Hash

          Push-Location 'out/hostplay'
          try {
            & $patcher --check
            if ($LASTEXITCODE -ne 0) { throw 'Default compatibility check failed on TerrariaServer.exe.' }

            & $patcher
            if ($LASTEXITCODE -ne 0) { throw 'Host patch install failed.' }

            $serverPatched = (Get-FileHash '.\TerrariaServer.exe' -Algorithm SHA256).Hash
            $clientAfterInstall = (Get-FileHash '.\Terraria.exe' -Algorithm SHA256).Hash
            if ($serverPatched -eq $serverBefore) { throw 'TerrariaServer.exe was not modified.' }
            if ($clientAfterInstall -ne $clientBefore) { throw 'BUG: Terraria.exe client was modified by Option A.' }

            & dotnet '.\TerrariaServer.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Patched server / vanilla guest behavior failed.' }

            & $patcher --check
            if ($LASTEXITCODE -ne 0) { throw 'Post-patch structural check failed.' }

            & $patcher --restore
            if ($LASTEXITCODE -ne 0) { throw 'Host patch restore failed.' }

            $serverAfter = (Get-FileHash '.\TerrariaServer.exe' -Algorithm SHA256).Hash
            $clientAfter = (Get-FileHash '.\Terraria.exe' -Algorithm SHA256).Hash
            if ($serverBefore -ne $serverAfter) { throw 'Server restore did not reproduce the original byte-for-byte.' }
            if ($clientBefore -ne $clientAfter) { throw 'Terraria.exe client changed during host patch lifecycle.' }
            if (Test-Path '.\InfiniteAnglerHost.manifest.json') { throw 'Manifest remained after successful restore.' }
          }
          finally {
            Pop-Location
          }

      - name: Package executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'out/InfiniteAnglerHost/InfiniteAnglerHost.exe')) {
            throw 'InfiniteAnglerHost.exe was not produced.'
          }
          $hash = (Get-FileHash 'out/InfiniteAnglerHost/InfiniteAnglerHost.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA256=$hash" | Set-Content 'out/InfiniteAnglerHost/SHA256.txt'
          Copy-Item 'terraria/infinite-angler-host/README.md' 'out/InfiniteAnglerHost/README.md'
          Get-ChildItem 'out/InfiniteAnglerHost'

      - name: Upload host-only drop-in package
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteAnglerHost-win-x64
          path: out/InfiniteAnglerHost/
          if-no-files-found: error
