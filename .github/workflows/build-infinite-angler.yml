name: Build Infinite Angler

on:
  workflow_dispatch:
  push:
    paths:
      - 'terraria/infinite-angler/**'
      - '.github/workflows/build-infinite-angler.yml'
  pull_request:
    paths:
      - 'terraria/infinite-angler/**'
      - '.github/workflows/build-infinite-angler.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore terraria/infinite-angler/InfiniteAngler.csproj

      - name: Publish single-file Windows executable
        run: >-
          dotnet publish terraria/infinite-angler/InfiniteAngler.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -o out/InfiniteAngler

      - name: Build synthetic Terraria fixture
        run: >-
          dotnet build terraria/infinite-angler/test-fixture/SyntheticTerraria.csproj
          -c Release
          -o out/fixture

      - name: Exercise structural patch and restore
        shell: pwsh
        run: |
          $patcher = Resolve-Path 'out/InfiniteAngler/InfiniteAngler.exe'
          $fixture = Resolve-Path 'out/fixture/SyntheticTerraria.dll'
          $before = (Get-FileHash $fixture -Algorithm SHA256).Hash

          & $patcher --check --target $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility check failed on synthetic fixture.' }

          & $patcher --target $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Patch install failed on synthetic fixture.' }

          & dotnet $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Patched synthetic Terraria behavior failed.' }

          & $patcher --check --target $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Post-patch structural check failed.' }

          & $patcher --restore --target $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed on synthetic fixture.' }

          $after = (Get-FileHash $fixture -Algorithm SHA256).Hash
          if ($before -ne $after) { throw 'Restore did not reproduce the original fixture byte-for-byte.' }

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'out/InfiniteAngler/InfiniteAngler.exe')) {
            throw 'InfiniteAngler.exe was not produced.'
          }
          $hash = (Get-FileHash 'out/InfiniteAngler/InfiniteAngler.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA256=$hash" | Set-Content 'out/InfiniteAngler/SHA256.txt'
          Copy-Item 'terraria/infinite-angler/README.md' 'out/InfiniteAngler/README.md'
          Get-ChildItem 'out/InfiniteAngler'

      - name: Upload drop-in package
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteAngler-win-x64
          path: out/InfiniteAngler/
          if-no-files-found: error
