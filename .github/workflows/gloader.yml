name: gloader

on:
  push:
    paths:
      - "gloader/**"
      - ".github/workflows/gloader.yml"
  pull_request:
    paths:
      - "gloader/**"
      - ".github/workflows/gloader.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gloader

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore gloader.sln
          dotnet restore tests/InfiniteAnglerCompile/InfiniteAnglerCompile.csproj

      - name: Build
        shell: pwsh
        run: |
          dotnet build gloader.sln -c Release --no-restore
          dotnet build tests/InfiniteAnglerCompile/InfiniteAnglerCompile.csproj -c Release --no-restore

      - name: Publish
        shell: pwsh
        run: ./build.ps1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gloader
          path: gloader/dist/gloader/
