# VGM Radio settings
# Changes apply the next time Terraria starts through gloader.

# Sources: Rainwave, GTT
Source=Rainwave

# Rainwave stations: All, Game, OCReMix, Covers, Chiptunes, Chill
# GTT has one giant station, so Station is ignored when Source=GTT.
Station=All

# Show the Terraria-styled now-playing message when the song changes.
ShowNowPlaying=true
